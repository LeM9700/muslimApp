# Analysis options pour Muslim App
# Configuration pour un code Flutter de qualité selon les spécifications

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Style et lisibilité
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_const
    - unnecessary_new
    - use_key_in_widget_constructors
    
    # Sécurité et bonnes pratiques
    - avoid_print
    - avoid_unnecessary_containers
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - no_logic_in_create_state
    - prefer_typing_uninitialized_variables
    - use_build_context_synchronously
    
    # Performance
    - prefer_collection_literals
    - prefer_for_elements_to_map_fromIterable
    - prefer_if_elements_to_conditional_expressions
    - prefer_spread_collections
    
    # Null safety
    - unnecessary_null_checks
    - unnecessary_null_in_if_null_operators
    - unnecessary_nullable_for_final_variable_declarations

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  
  errors:
    # Erreurs critiques à ne pas ignorer
    invalid_assignment: error
    invalid_use_of_protected_member: error
    missing_required_param: error
    undefined_method: error
    undefined_getter: error
    undefined_setter: error
    
    # Warnings importantes pour la qualité
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    
    # Info pour amélioration continue
    todo: info
    
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true