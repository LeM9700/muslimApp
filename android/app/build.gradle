plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Lecture des propriétés de signature depuis android/key.properties (gitignored)
// Générer avec : keytool -genkey -v -keystore android/muslim-app-release.jks
//               -keyalg RSA -keysize 2048 -validity 10000 -alias muslimapp
def keyPropertiesFile = rootProject.file('key.properties')
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader -> keyProperties.load(reader) }
}

android {
    namespace "com.elboazzati.muslimapp"
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            // [🔒 SÉCURITÉ] Valeurs lues depuis android/key.properties (jamais committé)
            // Si key.properties absent → la release ne signera pas (CI doit fournir les variables)
            if (keyPropertiesFile.exists()) {
                keyAlias       keyProperties['keyAlias']
                keyPassword    keyProperties['keyPassword']
                storeFile      file(keyProperties['storeFile'])
                storePassword  keyProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.elboazzati.muslimapp"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig keyPropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug  // fallback local seulement — jamais en CI/CD prod
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}