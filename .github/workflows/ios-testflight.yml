name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      test_audio_url:
        description: "OBLIGATOIRE tant que les sons d'adhan du repo sont de substitution : URL https d'un adhan de TEST, intégré à CE build uniquement (jamais commité). Vide = sons du repo (build App Store)."
        required: false
        default: ''
      test_audio_short:
        description: "Adhan court : passage « Allahu akbar » ×2 (début-fin)"
        required: false
        default: '0:00-0:08'
      test_audio_long_start:
        description: "Début de l'extrait de 30 s"
        required: false
        default: '0:00'
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.elboazzati.muslimapp
  WIDGET_BUNDLE_ID: com.elboazzati.muslimapp.PrayerWidget

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Build de test : l'audio est téléchargé et converti ici, dans le
      # runner, puis intégré à l'IPA. Il n'entre jamais dans git.
      - name: Prepare TEST adhan audio
        if: ${{ inputs.test_audio_url }}
        env:
          TEST_AUDIO_URL: ${{ inputs.test_audio_url }}
          TEST_AUDIO_SHORT: ${{ inputs.test_audio_short }}
          TEST_AUDIO_LONG_START: ${{ inputs.test_audio_long_start }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # [🔒] Entrées passées par variables d'environnement (jamais
          # interpolées dans le script) et URL limitée à https.
          # Espaces parasites (copier-coller) : curl rejette l'URL sinon.
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
          TEST_AUDIO_URL="$(trim "$TEST_AUDIO_URL")"
          TEST_AUDIO_SHORT="$(trim "$TEST_AUDIO_SHORT")"
          TEST_AUDIO_LONG_START="$(trim "$TEST_AUDIO_LONG_START")"
          case "$TEST_AUDIO_URL" in
            https://*) ;;
            *) echo "::error::test_audio_url doit commencer par https://"; exit 1 ;;
          esac
          brew install ffmpeg
          curl -fsSL --max-filesize 52428800 -o "$RUNNER_TEMP/test_adhan" "$TEST_AUDIO_URL"
          scripts/adhan/prepare_adhan.sh \
            --source "$RUNNER_TEMP/test_adhan" \
            --short "$TEST_AUDIO_SHORT" \
            --long-start "$TEST_AUDIO_LONG_START" \
            --test
          echo "ADHAN_TEST_AUDIO=true" >> "$GITHUB_ENV"
          {
            echo "## ⚠️ Build avec audio d'adhan de TEST"
            echo "Ce build TestFlight contient un audio non publiable."
            echo "**Ne jamais le soumettre à l'App Store.**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bloque tout build qui embarquerait les sons de substitution ou un
      # audio de test commité par erreur (tags v* et lancements manuels
      # sans audio de test).
      - name: Check adhan audio is publishable
        if: ${{ !inputs.test_audio_url }}
        run: |
          if ! scripts/adhan/check_release_audio.sh; then
            echo "::error::Sons d'adhan non publiables. Pour un build de TEST, relancez le workflow en remplissant « test_audio_url » (URL https d'un adhan). Pour l'App Store, préparez les vrais sons : scripts/adhan/README.md"
            exit 1
          fi

      - name: Restore Firebase config files
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # [⚠️ PROD] L'extension du widget a son propre identifiant, donc
          # son propre profil. Message clair plutôt qu'un échec de signature
          # obscur au moment de l'archive.
          if [ -z "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_WIDGET_PROVISIONING_PROFILE_BASE64 manquant (profil App Store de $WIDGET_BUNDLE_ID, avec l'App Group). Voir scripts/ios/WIDGET_SETUP.md"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget.mobileprovision"
          echo "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"
          security cms -D -i "$WIDGET_PROFILE_PATH" > "$RUNNER_TEMP/widget.plist"
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/widget.plist")
          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/widget.plist")
          cp "$WIDGET_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed widget profile: $WIDGET_PROFILE_NAME ($WIDGET_PROFILE_UUID)"

          # Les deux profils doivent porter l'App Group partagé, sinon le
          # widget ne voit jamais les horaires (aucune erreur à l'exécution).
          for plist in "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/widget.plist"; do
            if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" "$plist" | grep -q "group.com.elboazzati.muslimapp"; then
              echo "::error::Le profil $(/usr/libexec/PlistBuddy -c 'Print Name' "$plist") n'inclut pas l'App Group group.com.elboazzati.muslimapp. Régénérez-le (scripts/ios/WIDGET_SETUP.md)."
              exit 1
            fi
          done

          # L'app déclare l'entitlement « Time Sensitive » : son profil doit
          # l'inclure, sinon l'archive échoue avec une erreur peu lisible.
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.usernotifications.time-sensitive" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::Le profil de l'app n'inclut pas « Time Sensitive Notifications ». Cochez la capacité sur $BUNDLE_ID puis régénérez le profil (scripts/ios/WIDGET_SETUP.md, étape 2)."
            exit 1
          fi

      - name: Configure manual signing for Release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Release.xcconfig only applies to the Runner target (not Pods), so
          # manual signing set here doesn't leak into plugin frameworks.
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          # Extension du widget : même équipe, son propre profil.
          cat >> ios/PrayerWidget/PrayerWidgetRelease.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $WIDGET_PROFILE_NAME
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Install dependencies
        run: |
          flutter pub get
          # Regenerates ios/Flutter/Generated.xcconfig with this runner's FLUTTER_ROOT
          flutter build ios --config-only --release --no-codesign
          cd ios && pod install --repo-update

      - name: Build IPA
        env:
          SUNNAH_API_KEY: ${{ secrets.SUNNAH_API_KEY }}
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SUNNAH_API_KEY="$SUNNAH_API_KEY" \
            --dart-define=ADHAN_TEST_AUDIO="${ADHAN_TEST_AUDIO:-false}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Keep IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}${{ inputs.test_audio_url && '-TEST-AUDIO' || '' }}
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 "$RUNNER_TEMP/dist.p12"
