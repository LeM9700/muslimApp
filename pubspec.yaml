name: muslim_app
description: A Flutter MVP app for the Muslim community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  
  # Audio
  audioplayers: ^5.2.1
  
  # Location & Compass
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  
  # State Management
  provider: ^6.1.2

  # HTTP & Environment
  http: ^1.2.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - .env
  #   - assets/images/
  #   - assets/icons/
  
  # Fonts pour texte arabe (TODO: télécharger NotoNaskhArabic-Regular.ttf)
  # fonts:
  #   - family: NotoNaskhArabic
  #     fonts:
  #       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf