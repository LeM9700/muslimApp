name: muslim_app
description: A Flutter MVP app for the Muslim community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # i18n
  intl: ^0.20.2

  # Animations
  lottie: ^3.1.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  
  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Location & Compass
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  
  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  
  # Assets
  assets:
    - assets/data/
    - assets/lottie/
  #   - assets/images/
  #   - assets/icons/
  
  # Fonts pour texte arabe (TODO: télécharger NotoNaskhArabic-Regular.ttf)
  # fonts:
  #   - family: NotoNaskhArabic
  #     fonts:
  #       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
# App icon generation: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B1F33"
